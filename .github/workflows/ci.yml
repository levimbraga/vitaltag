# A execução automática está desativada porque o repositório ainda não tem
# package.json. Reativo os gatilhos de push e pull request quando eu
# inicializar o projeto Next.js, na Sprint 2.

name: CI

on:
  workflow_dispatch:

jobs:
  quality:
    name: Lint e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test
